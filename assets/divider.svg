<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 30" width="100%" height="30">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00F0FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#7000FF" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="1"/>
      <stop offset="50%" stop-color="#7000FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulseParticle {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.4); opacity: 1; }
      }
      .center-particle { animation: pulseParticle 3s ease-in-out infinite; transform-origin: 475px 15px; }
    </style>
  </defs>

  <!-- Divider Neon Line -->
  <line x1="20" y1="15" x2="930" y2="15" stroke="url(#dividerGrad)" stroke-width="2" filter="url(#glow)"/>

  <!-- Center Glowing Diamond Node -->
  <g class="center-particle">
    <circle cx="475" cy="15" r="8" fill="url(#nodeGlow)" filter="url(#glow)"/>
    <polygon points="475,9 481,15 475,21 469,15" fill="#00F0FF"/>
  </g>
</svg>
