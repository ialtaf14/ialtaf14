    <rect width="264" height="8" rx="4" fill="#00F0FF" class="pulsing-bar"/>
    <rect x="264" width="237" height="8" fill="#A855F7"/>
    <rect x="501" width="202" height="8" fill="#38BDF8"/>
    <rect x="703" width="177" height="8" rx="4" fill="#10B981"/>
  </g>
</svg>
