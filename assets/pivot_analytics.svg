      <text x="14" y="24" font-family="monospace" font-size="10" fill="#94A3B8">SQL QUERY OPTIMIZATION</text>
      <text x="14" y="46" font-family="sans-serif" font-size="18" font-weight="800" fill="#A855F7">4.2x Speedup</text>
    </g>
    <!-- KPI 3 -->
    <g transform="translate(440, 0)">
      <rect width="200" height="58" rx="10" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
