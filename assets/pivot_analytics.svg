<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 340" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#7000FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.9; }
      }
      .pulsing-bar { animation: pulseGlow 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="950" height="340" rx="18" fill="#090D16"/>
  <rect width="950" height="340" rx="18" fill="url(#bgGlow)"/>
  <rect x="10" y="10" width="930" height="320" rx="16" fill="rgba(15, 23, 42, 0.7)" stroke="url(#glassBorder)" stroke-width="1.5"/>

  <!-- Title -->
  <text x="35" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#00F0FF" letter-spacing="1.5">📊 PANDAS &amp; SQL PIVOT TABLE ANALYTICS ENGINE</text>
  <text x="35" y="60" font-family="sans-serif" font-size="11" fill="#94A3B8">Multi-Dimensional Data Aggregation &amp; Executive Revenue Insights</text>

  <!-- KPI SUMMARY CARDS -->
  <g transform="translate(35, 75)">
