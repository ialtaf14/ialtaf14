<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 120" width="100%" height="100%">
  <defs>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#7000FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7000FF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="950" height="120" rx="12" fill="#090D16"/>

  <!-- Wave Layer 1 -->
  <path d="M0 60 Q 237.5 20, 475 60 T 950 60 L 950 120 L 0 120 Z" fill="url(#waveGrad1)"/>

  <!-- Wave Layer 2 -->
  <path d="M0 70 Q 237.5 90, 475 60 T 950 70 L 950 120 L 0 120 Z" fill="url(#waveGrad2)" opacity="0.7"/>

  <!-- Top Accent Glowing Curve -->
  <path d="M0 60 Q 237.5 20, 475 60 T 950 60" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
</svg>
