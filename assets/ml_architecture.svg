<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#7000FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes arrowPulse {
        0%, 100% { opacity: 0.4; transform: translateX(0); }
        50% { opacity: 1; transform: translateX(4px); }
      }
      .animated-arrow { animation: arrowPulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="950" height="240" rx="16" fill="#090D16"/>
  <rect width="950" height="240" rx="16" fill="url(#bgGlow)"/>
  <rect x="10" y="10" width="930" height="220" rx="14" fill="rgba(15, 23, 42, 0.65)" stroke="url(#glassBorder)" stroke-width="1.5"/>

  <!-- Title -->
  <text x="35" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#00F0FF" letter-spacing="1.5">🧠 MACHINE LEARNING &amp; DATA PIPELINE ARCHITECTURE</text>

  <!-- 4 Step Flow Cards -->
  <g transform="translate(35, 65)">
    <!-- Stage 1 -->
    <g transform="translate(0, 0)">
      <rect width="195" height="135" rx="12" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1"/>
      <circle cx="25" cy="28" r="10" fill="rgba(0, 240, 255, 0.2)"/>
      <text x="25" y="32" font-family="sans-serif" font-size="11" font-weight="800" fill="#00F0FF" text-anchor="middle">01</text>
      <text x="45" y="31" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">DATA INGESTION</text>
      <line x1="15" y1="48" x2="180" y2="48" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="15" y="70" font-family="sans-serif" font-size="11" fill="#94A3B8">• SQL Querying</text>
      <text x="15" y="88" font-family="sans-serif" font-size="11" fill="#94A3B8">• Relational DB Extraction</text>
      <text x="15" y="106" font-family="sans-serif" font-size="11" fill="#94A3B8">• CSV / JSON Pipelines</text>
    </g>

    <!-- Arrow 1 -->
    <g transform="translate(202, 55)" class="animated-arrow">
      <path d="M0 12 L15 12 M10 6 L16 12 L10 18" stroke="#00F0FF" stroke-width="2" fill="none" filter="url(#neonGlow)"/>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(225, 0)">
      <rect width="195" height="135" rx="12" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
      <circle cx="25" cy="28" r="10" fill="rgba(56, 189, 248, 0.2)"/>
      <text x="25" y="32" font-family="sans-serif" font-size="11" font-weight="800" fill="#38BDF8" text-anchor="middle">02</text>
      <text x="45" y="31" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">EDA &amp; PROCESSING</text>
      <line x1="15" y1="48" x2="180" y2="48" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="15" y="70" font-family="sans-serif" font-size="11" fill="#94A3B8">• Pandas &amp; NumPy</text>
      <text x="15" y="88" font-family="sans-serif" font-size="11" fill="#94A3B8">• Data Cleaning &amp; Imputation</text>
      <text x="15" y="106" font-family="sans-serif" font-size="11" fill="#94A3B8">• Feature Engineering</text>
    </g>

    <!-- Arrow 2 -->
    <g transform="translate(427, 55)" class="animated-arrow">
      <path d="M0 12 L15 12 M10 6 L16 12 L10 18" stroke="#7000FF" stroke-width="2" fill="none" filter="url(#neonGlow)"/>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(450, 0)">
      <rect width="195" height="135" rx="12" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1"/>
      <circle cx="25" cy="28" r="10" fill="rgba(168, 85, 247, 0.2)"/>
      <text x="25" y="32" font-family="sans-serif" font-size="11" font-weight="800" fill="#A855F7" text-anchor="middle">03</text>
      <text x="45" y="31" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">MODEL TRAINING</text>
      <line x1="15" y1="48" x2="180" y2="48" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="15" y="70" font-family="sans-serif" font-size="11" fill="#94A3B8">• Scikit-Learn Models</text>
      <text x="15" y="88" font-family="sans-serif" font-size="11" fill="#94A3B8">• Classification / Regression</text>
      <text x="15" y="106" font-family="sans-serif" font-size="11" fill="#94A3B8">• Model Evaluation Metrics</text>
    </g>

    <!-- Arrow 3 -->
    <g transform="translate(652, 55)" class="animated-arrow">
      <path d="M0 12 L15 12 M10 6 L16 12 L10 18" stroke="#10B981" stroke-width="2" fill="none" filter="url(#neonGlow)"/>
    </g>

    <!-- Stage 4 -->
    <g transform="translate(675, 0)">
      <rect width="205" height="135" rx="12" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
      <circle cx="25" cy="28" r="10" fill="rgba(16, 185, 129, 0.2)"/>
      <text x="25" y="32" font-family="sans-serif" font-size="11" font-weight="800" fill="#10B981" text-anchor="middle">04</text>
      <text x="45" y="31" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">INSIGHTS &amp; DASHBOARDS</text>
      <line x1="15" y1="48" x2="190" y2="48" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="15" y="70" font-family="sans-serif" font-size="11" fill="#94A3B8">• Power BI Visualizations</text>
      <text x="15" y="88" font-family="sans-serif" font-size="11" fill="#94A3B8">• Executive KPI Dashboards</text>
      <text x="15" y="106" font-family="sans-serif" font-size="11" fill="#94A3B8">• Business Decision Support</text>
    </g>
  </g>
</svg>
