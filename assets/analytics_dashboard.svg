<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 260" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes graphWave {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .chart-curve { animation: graphWave 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Card -->
  <rect width="950" height="260" rx="16" fill="#090D16"/>
  <rect width="950" height="260" rx="16" fill="url(#bgGlow)"/>
  <rect x="10" y="10" width="930" height="240" rx="14" fill="rgba(15, 23, 42, 0.65)" stroke="url(#glassBorder)" stroke-width="1.5"/>

  <!-- Section Title -->
  <text x="35" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#38BDF8" letter-spacing="1.5">📊 DATA ANALYTICS PERFORMANCE &amp; KPI DASHBOARD</text>

  <!-- KPI CARDS (Left Side) -->
  <g transform="translate(35, 65)">
    <!-- KPI 1 -->
    <g transform="translate(0, 0)">
      <rect width="190" height="75" rx="10" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1"/>
      <text x="18" y="32" font-family="sans-serif" font-size="22" font-weight="800" fill="#00F0FF">1.5M+</text>
      <text x="18" y="55" font-family="sans-serif" font-size="11" font-weight="600" fill="#94A3B8">Data Points Processed</text>
    </g>
    <!-- KPI 2 -->
    <g transform="translate(205, 0)">
      <rect width="190" height="75" rx="10" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>
      <text x="18" y="32" font-family="sans-serif" font-size="22" font-weight="800" fill="#A855F7">99.2%</text>
      <text x="18" y="55" font-family="sans-serif" font-size="11" font-weight="600" fill="#94A3B8">Query Accuracy Rate</text>
    </g>
    <!-- KPI 3 -->
    <g transform="translate(0, 90)">
      <rect width="190" height="75" rx="10" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
      <text x="18" y="32" font-family="sans-serif" font-size="22" font-weight="800" fill="#FBBF24">15+</text>
      <text x="18" y="55" font-family="sans-serif" font-size="11" font-weight="600" fill="#94A3B8">Dashboards &amp; Reports</text>
    </g>
    <!-- KPI 4 -->
    <g transform="translate(205, 90)">
      <rect width="190" height="75" rx="10" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <text x="18" y="32" font-family="sans-serif" font-size="22" font-weight="800" fill="#10B981">96.4%</text>
      <text x="18" y="55" font-family="sans-serif" font-size="11" font-weight="600" fill="#94A3B8">Model Precision Score</text>
    </g>
  </g>

  <!-- LIVE ANALYTICS CHART (Right Side) -->
  <g transform="translate(450, 65)">
    <rect width="455" height="165" rx="10" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

    <!-- Chart Grid Lines -->
    <line x1="20" y1="35" x2="435" y2="35" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <line x1="20" y1="75" x2="435" y2="75" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <line x1="20" y1="115" x2="435" y2="115" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

    <!-- Area Chart Gradient Fill -->
    <path d="M20,135 Q70,95 120,105 T220,55 T320,70 T435,25 L435,145 L20,145 Z" fill="url(#areaGrad)"/>

    <!-- Area Chart Line -->
    <path d="M20,135 Q70,95 120,105 T220,55 T320,70 T435,25" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#neonGlow)" class="chart-curve"/>

    <!-- Chart Highlight Nodes -->
    <circle cx="120" cy="105" r="4" fill="#00F0FF" filter="url(#neonGlow)"/>
    <circle cx="220" cy="55" r="4" fill="#7000FF" filter="url(#neonGlow)"/>
    <circle cx="320" cy="70" r="4" fill="#38BDF8" filter="url(#neonGlow)"/>
    <circle cx="435" cy="25" r="5" fill="#10B981" filter="url(#neonGlow)"/>

    <!-- Chart Legend Footer -->
    <text x="25" y="156" font-family="sans-serif" font-size="10" fill="#64748B">Q1</text>
    <text x="120" y="156" font-family="sans-serif" font-size="10" fill="#64748B">Q2</text>
    <text x="220" y="156" font-family="sans-serif" font-size="10" fill="#64748B">Q3</text>
    <text x="320" y="156" font-family="sans-serif" font-size="10" fill="#64748B">Q4</text>
    <text x="415" y="156" font-family="sans-serif" font-size="10" fill="#00F0FF" font-weight="700">TARGET</text>
  </g>
</svg>
