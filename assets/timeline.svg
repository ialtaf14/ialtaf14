<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#7000FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7000FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.3); opacity: 1; }
      }
      .glowing-node { animation: pulseNode 3s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Base Container -->
  <rect width="950" height="200" rx="16" fill="#090D16"/>
  <rect width="950" height="200" rx="16" fill="url(#bgGlow)"/>
  <rect x="10" y="10" width="930" height="180" rx="14" fill="rgba(15, 23, 42, 0.65)" stroke="url(#glassBorder)" stroke-width="1.5"/>

  <!-- Title -->
  <text x="35" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#00F0FF" letter-spacing="1.5">🚀 CAREER &amp; LEARNING ROADMAP TIMELINE</text>

  <!-- Horizontal Connected Line -->
  <line x1="80" y1="110" x2="870" y2="110" stroke="url(#pathGrad)" stroke-width="3" opacity="0.6" filter="url(#neonGlow)"/>

  <!-- 5 Roadmap Nodes -->
  <g transform="translate(0, 0)">
    <!-- Node 1: 2024 Foundations -->
    <g transform="translate(80, 110)">
      <circle cx="0" cy="0" r="10" fill="#090D16" stroke="#00F0FF" stroke-width="3" filter="url(#neonGlow)"/>
      <circle cx="0" cy="0" r="4" fill="#00F0FF"/>
      <!-- Text Above -->
      <text x="0" y="-35" font-family="sans-serif" font-size="12" font-weight="800" fill="#00F0FF" text-anchor="middle">2024</text>
      <!-- Details Below -->
      <text x="0" y="25" font-family="sans-serif" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">CS Fundamentals</text>
      <text x="0" y="40" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Programming &amp; Logic</text>
    </g>

    <!-- Node 2: Python & SQL -->
    <g transform="translate(275, 110)">
      <circle cx="0" cy="0" r="10" fill="#090D16" stroke="#38BDF8" stroke-width="3" filter="url(#neonGlow)"/>
      <circle cx="0" cy="0" r="4" fill="#38BDF8"/>
      <text x="0" y="-35" font-family="sans-serif" font-size="12" font-weight="800" fill="#38BDF8" text-anchor="middle">2024 - 2025</text>
      <text x="0" y="25" font-family="sans-serif" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">Python &amp; SQL</text>
      <text x="0" y="40" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Analytics &amp; Queries</text>
    </g>

    <!-- Node 3: Data Analytics & Power BI -->
    <g transform="translate(470, 110)">
      <circle cx="0" cy="0" r="10" fill="#090D16" stroke="#7000FF" stroke-width="3" filter="url(#neonGlow)"/>
      <circle cx="0" cy="0" r="4" fill="#7000FF"/>
      <text x="0" y="-35" font-family="sans-serif" font-size="12" font-weight="800" fill="#A855F7" text-anchor="middle">2025</text>
      <text x="0" y="25" font-family="sans-serif" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">Data Stack &amp; BI</text>
      <text x="0" y="40" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Pandas, NumPy, Power BI</text>
    </g>

    <!-- Node 4: QSpiders Trainee & ML -->
    <g transform="translate(665, 110)">
      <circle cx="0" cy="0" r="10" fill="#090D16" stroke="#EC4899" stroke-width="3" filter="url(#neonGlow)"/>
      <circle cx="0" cy="0" r="4" fill="#EC4899"/>
      <text x="0" y="-35" font-family="sans-serif" font-size="12" font-weight="800" fill="#EC4899" text-anchor="middle">Aug 2025 – Present</text>
      <text x="0" y="25" font-family="sans-serif" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">QSpiders Trainee</text>
      <text x="0" y="40" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Software Testing &amp; ML</text>
    </g>

    <!-- Node 5: Target Goal -->
    <g transform="translate(860, 110)">
      <circle cx="0" cy="0" r="12" fill="#10B981" stroke="#00F0FF" stroke-width="2" filter="url(#neonGlow)"/>
      <polygon points="860,105 865,110 860,115 855,110" fill="#FFFFFF"/>
      <text x="0" y="-35" font-family="sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="middle">TARGET GOAL</text>
      <text x="0" y="25" font-family="sans-serif" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">Data Analyst / ML</text>
      <text x="0" y="40" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Data Scientist Role</text>
    </g>
  </g>
</svg>
