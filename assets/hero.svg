<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="100%" height="100%">
  <defs>
    <radialGradient id="bg1" cx="20%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#0B1220" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#060B17" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bgLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="panelBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0B1120" flood-opacity="0.35"/>
    </filter>
    <filter id="glassGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes floatUp { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      @keyframes floatDown { 0%,100% { transform: translateY(0); } 50% { transform: translateY(12px); } }
      @keyframes shineMove { 0% { opacity: 0; transform: translateX(-120px); } 50% { opacity: 0.35; } 100% { opacity: 0; transform: translateX(980px); } }
      @keyframes pulseGlow { 0%,100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.04); opacity: 1; } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .float { animation: floatUp 9s ease-in-out infinite; }
      .float-slow { animation: floatDown 13s ease-in-out infinite; }
      .pulse { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .spin { animation: spin 22s linear infinite; transform-origin: center; }
      .shine { animation: shineMove 18s linear infinite; }
      .dim { opacity: 0.55; }
    </style>
  </defs>

  <rect width="980" height="480" rx="28" fill="#060B17"/>
  <rect width="980" height="480" rx="28" fill="url(#bg1)"/>
  <rect x="0" y="0" width="980" height="480" rx="28" fill="url(#bgLine)" opacity="0.2"/>
  <rect x="38" y="34" width="904" height="412" rx="32" fill="rgba(255,255,255,0.04)"/>
  <rect x="52" y="48" width="876" height="384" rx="28" fill="url(#panelFill)" stroke="url(#panelBorder)" stroke-width="1.5" filter="url(#softShadow)"/>

  <g filter="url(#glassGlow)">
    <ellipse cx="250" cy="90" rx="160" ry="62" fill="#22D3EE" opacity="0.08"/>
    <ellipse cx="760" cy="75" rx="110" ry="45" fill="#A855F7" opacity="0.06"/>
    <ellipse cx="770" cy="370" rx="120" ry="55" fill="#38BDF8" opacity="0.06"/>
  </g>

  <text x="76" y="90" font-family="Inter, Arial, sans-serif" font-size="14" fill="#A5B4FC">Data science profile • premium dashboard • glass UI</text>
  <text x="76" y="140" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF">Altaf Khan</text>
  <text x="76" y="184" font-family="Inter, Arial, sans-serif" font-size="18" fill="#CBD5E1">Data Analyst • CSE graduate • ML & visualization specialist</text>

  <rect x="72" y="220" width="736" height="190" rx="30" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
  <rect x="82" y="230" width="716" height="170" rx="24" fill="rgba(255,255,255,0.08)"/>

  <g transform="translate(100, 248)">
    <rect x="0" y="0" width="180" height="120" rx="24" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)"/>
    <rect x="18" y="16" width="40" height="40" rx="12" fill="#38BDF8"/>
    <rect x="68" y="20" width="88" height="12" rx="6" fill="#E2E8F0" opacity="0.85"/>
    <rect x="68" y="40" width="60" height="10" rx="5" fill="#94A3B8" opacity="0.7"/>
    <rect x="18" y="70" width="142" height="12" rx="6" fill="rgba(255,255,255,0.1)"/>
    <rect x="18" y="92" width="110" height="12" rx="6" fill="#60A5FA"/>
    <text x="18" y="118" font-family="Inter, sans-serif" font-size="10" fill="#CBD5E1">SQL, PowerBI, EDA</text>
  </g>

  <g transform="translate(300, 248)" class="float">
    <rect x="0" y="0" width="190" height="140" rx="28" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.24)" stroke-width="1"/>
    <rect x="18" y="16" width="154" height="24" rx="12" fill="#0F172A" opacity="0.45"/>
    <rect x="18" y="54" width="150" height="10" rx="5" fill="#E2E8F0" opacity="0.3"/>
    <rect x="18" y="74" width="120" height="10" rx="5" fill="#60A5FA"/>
    <rect x="18" y="96" width="85" height="10" rx="5" fill="#8B5CF6"/>
    <text x="18" y="128" font-family="Inter, Arial, sans-serif" font-size="10" fill="#E2E8F0">Model Accuracy • 96.4%</text>
  </g>

  <g transform="translate(520, 260)" class="float-slow">
    <rect x="0" y="0" width="190" height="112" rx="24" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="20" y="28" font-family="Inter, Arial, sans-serif" font-size="12" fill="#60A5FA" font-weight="700">Insights</text>
    <text x="20" y="50" font-family="Inter, Arial, sans-serif" font-size="22" fill="#FFFFFF" font-weight="800">21.4k</text>
    <text x="20" y="70" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#94A3B8">queries / day</text>
    <rect x="20" y="84" width="150" height="12" rx="6" fill="rgba(255,255,255,0.12)"/>
    <rect x="20" y="84" width="108" height="12" rx="6" fill="#22D3EE"/>
  </g>

  <g transform="translate(760, 108)">
    <circle cx="0" cy="0" r="32" fill="#38BDF8" opacity="0.08"/>
    <circle cx="0" cy="0" r="18" fill="#60A5FA" opacity="0.18" class="pulse"/>
    <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
    <text x="-14" y="6" font-family="Inter, sans-serif" font-size="10" fill="#0F172A">AI</text>
  </g>

  <g transform="translate(660, 120)">
    <line x1="0" y1="16" x2="58" y2="16" stroke="#60A5FA" stroke-width="2" opacity="0.55"/>
    <circle cx="70" cy="16" r="8" fill="#60A5FA" opacity="0.85"/>
    <circle cx="104" cy="16" r="6" fill="#A855F7" opacity="0.85"/>
    <circle cx="132" cy="16" r="4" fill="#22D3EE" opacity="0.85"/>
  </g>

  <text x="76" y="294" font-family="Inter, Arial, sans-serif" font-size="11" fill="#94A3B8">Hands-on dashboard design, model evaluation, visualization, and deployment-ready analytics.</text>
  <text x="76" y="316" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#FFFFFF">Premium hero image with refined glass panels and animated data elements.</text>

  <g class="shine" fill="rgba(255,255,255,0.18)">
    <rect x="90" y="76" width="180" height="16" rx="8"/>
    <rect x="350" y="120" width="140" height="12" rx="6"/>
  </g>

  <text x="82" y="410" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#94A3B8">Built for GitHub profile README presentation — rich, modern, and eye-catching.</text>
</svg>
