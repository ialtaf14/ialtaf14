<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#7000FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Border Gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#7000FF" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="codeBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- CSS Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes typingText {
        0%, 10% { opacity: 0; }
        15%, 90% { opacity: 1; }
        95%, 100% { opacity: 0; }
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .floating-element { animation: floatSlow 6s ease-in-out infinite; }
      .pulsing-core { animation: pulseGlow 4s ease-in-out infinite; transform-origin: 670px 120px; }
      .spinning-ring { animation: spinSlow 20s linear infinite; transform-origin: 670px 120px; }
      .spinning-ring-reverse { animation: spinSlow 15s linear infinite reverse; transform-origin: 670px 120px; }
      .animated-dash { stroke-dasharray: 6 6; animation: dashMove 2s linear infinite; }
      .cursor { animation: cursorBlink 1s infinite; }
      .badge-hover { transition: all 0.3s ease; }
    </style>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="950" height="440" rx="20" fill="#090D16"/>
  <rect width="950" height="440" rx="20" fill="url(#bgGlow1)"/>
  <rect width="950" height="440" rx="20" fill="url(#bgGlow2)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 40 H950 M0 80 H950 M0 120 H950 M0 160 H950 M0 200 H950 M0 240 H950 M0 280 H950 M0 320 H950 M0 360 H950 M0 400 H950" />
    <path d="M50 0 V440 M100 0 V440 M150 0 V440 M200 0 V440 M250 0 V440 M300 0 V440 M350 0 V440 M400 0 V440 M450 0 V440 M500 0 V440 M550 0 V440 M600 0 V440 M650 0 V440 M700 0 V440 M750 0 V440 M800 0 V440 M850 0 V440 M900 0 V440" />
  </g>

  <!-- Glass Main Outer Panel -->
  <rect x="15" y="15" width="920" height="410" rx="16" fill="rgba(15, 23, 42, 0.55)" stroke="url(#glassBorder)" stroke-width="1.5" filter="url(#softShadow)"/>

  <!-- ==================== LEFT COLUMN: IDENTIFICATION ==================== -->
  <!-- Top Status Pill -->
  <g transform="translate(45, 42)">
    <rect x="0" y="0" width="270" height="28" rx="14" fill="rgba(0, 240, 255, 0.08)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#00F0FF" filter="url(#neonGlow)"/>
    <text x="30" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#00F0FF" letter-spacing="1.5">AI &amp; DATA ANALYTICS PORTFOLIO</text>
  </g>

  <!-- Main Name Header -->
  <text x="45" y="115" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="48" font-weight="800" fill="url(#nameGradient)" letter-spacing="-0.5">Altaf Khan</text>

  <!-- Role Subtitle Line -->
  <text x="45" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" fill="#38BDF8" letter-spacing="0.5">
    Data Analyst <tspan fill="#7000FF">•</tspan> Machine Learning Enthusiast <tspan fill="#7000FF">•</tspan> Aspiring Data Scientist
  </text>

  <!-- Tagline Quote -->
  <text x="45" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94A3B8" italic="true">
    "Transforming complex data into predictive models &amp; actionable business insights."
  </text>

  <!-- Tech Badges Bar (Glass Pills) -->
  <g transform="translate(45, 210)">
    <!-- Python -->
    <g transform="translate(0, 0)">
      <rect width="85" height="30" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
      <text x="42.5" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#38BDF8" text-anchor="middle">Python</text>
    </g>
    <!-- SQL -->
    <g transform="translate(95, 0)">
      <rect width="65" height="30" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1"/>
      <text x="32.5" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#C084FC" text-anchor="middle">SQL</text>
    </g>
    <!-- Pandas -->
    <g transform="translate(170, 0)">
      <rect width="80" height="30" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1"/>
      <text x="40" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#00F0FF" text-anchor="middle">Pandas</text>
    </g>
    <!-- Power BI -->
    <g transform="translate(260, 0)">
      <rect width="90" height="30" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1"/>
      <text x="45" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#FBBF24" text-anchor="middle">Power BI</text>
    </g>
    <!-- Machine Learning -->
    <g transform="translate(360, 0)">
      <rect width="135" height="30" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1"/>
      <text x="67.5" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#F472B6" text-anchor="middle">Machine Learning</text>
    </g>
  </g>

  <!-- Location & Trainee Info Glass Ribbon -->
  <g transform="translate(45, 260)">
    <rect width="450" height="52" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <circle cx="25" cy="26" r="6" fill="#10B981" filter="url(#neonGlow)"/>
    <text x="42" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Software Testing &amp; Programming Trainee</text>
    <text x="42" y="38" font-family="sans-serif" font-size="11" font-weight="400" fill="#94A3B8">QSpiders Gurugram • August 2025 – Present</text>
  </g>

  <!-- Bottom Interactive Buttons Row -->
  <g transform="translate(45, 332)">
    <!-- Portfolio Link Button -->
    <g transform="translate(0, 0)">
      <rect width="145" height="38" rx="19" fill="url(#accentGradient)" stroke="#00F0FF" stroke-width="1" filter="url(#neonGlow)"/>
      <text x="72.5" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">🌐 Portfolio Website</text>
    </g>
    <!-- LinkedIn Button -->
    <g transform="translate(160, 0)">
      <rect width="115" height="38" rx="19" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
      <text x="57.5" y="24" font-family="sans-serif" font-size="13" font-weight="600" fill="#38BDF8" text-anchor="middle">💼 LinkedIn</text>
    </g>
    <!-- Contact Button -->
    <g transform="translate(290, 0)">
      <rect width="115" height="38" rx="19" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1"/>
      <text x="57.5" y="24" font-family="sans-serif" font-size="13" font-weight="600" fill="#C084FC" text-anchor="middle">📧 Email Me</text>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: NEURAL AI & CODE WINDOW ==================== -->
  <!-- AI Neural Brain / Core Graphic -->
  <g transform="translate(10, 0)">
    <!-- Orbital Rings -->
    <circle cx="670" cy="120" r="75" fill="none" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.4" class="spinning-ring" stroke-dasharray="10 15 30 10"/>
    <circle cx="670" cy="120" r="55" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.6" class="spinning-ring-reverse" stroke-dasharray="5 10"/>
    <circle cx="670" cy="120" r="35" fill="none" stroke="#7000FF" stroke-width="1.5" opacity="0.8"/>

    <!-- Neural Core -->
    <circle cx="670" cy="120" r="18" fill="url(#accentGradient)" filter="url(#neonGlow)" class="pulsing-core"/>

    <!-- Neural Connections & Nodes -->
    <line x1="670" y1="120" x2="600" y2="70" stroke="#00F0FF" stroke-width="1.5" opacity="0.6" class="animated-dash"/>
    <line x1="670" y1="120" x2="740" y2="70" stroke="#7000FF" stroke-width="1.5" opacity="0.6" class="animated-dash"/>
    <line x1="670" y1="120" x2="580" y2="140" stroke="#38BDF8" stroke-width="1.5" opacity="0.6" class="animated-dash"/>
    <line x1="670" y1="120" x2="760" y2="140" stroke="#C084FC" stroke-width="1.5" opacity="0.6" class="animated-dash"/>

    <!-- Peripheral Nodes -->
    <circle cx="600" cy="70" r="5" fill="#00F0FF" filter="url(#neonGlow)"/>
    <circle cx="740" cy="70" r="5" fill="#7000FF" filter="url(#neonGlow)"/>
    <circle cx="580" cy="140" r="4" fill="#38BDF8"/>
    <circle cx="760" cy="140" r="4" fill="#C084FC"/>
  </g>

  <!-- Floating Code Window (Realistic Glass IDE) -->
  <g transform="translate(525, 205)" class="floating-element">
    <!-- Window Body -->
    <rect width="395" height="195" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.5" filter="url(#softShadow)"/>
    <!-- Window Title Bar -->
    <path d="M0 12 Q0 0 12 0 L383 0 Q395 0 395 12 L395 32 L0 32 Z" fill="url(#codeBarGrad)"/>
    <!-- macOS Control Dots -->
    <circle cx="18" cy="16" r="5" fill="#FF5F56"/>
    <circle cx="34" cy="16" r="5" fill="#FFBD2E"/>
    <circle cx="50" cy="16" r="5" fill="#27C93F"/>
    <!-- File Title -->
    <text x="197.5" y="20" font-family="monospace" font-size="11" fill="#94A3B8" text-anchor="middle">ml_analytics_pipeline.py</text>

    <!-- Code Contents -->
    <g transform="translate(18, 48)" font-family="Consolas, 'Fira Code', Monaco, monospace" font-size="11.5" xml:space="preserve">
      <!-- Line 1 -->
      <text y="12">
        <tspan fill="#F472B6">import</tspan> <tspan fill="#F8FAFC">pandas</tspan> <tspan fill="#F472B6">as</tspan> <tspan fill="#38BDF8">pd</tspan>
      </text>
      <!-- Line 2 -->
      <text y="30">
        <tspan fill="#F472B6">from</tspan> <tspan fill="#F8FAFC">sklearn.ensemble</tspan> <tspan fill="#F472B6">import</tspan> <tspan fill="#38BDF8">RandomForestClassifier</tspan>
      </text>
      <!-- Line 3 -->
      <text y="48">
        <tspan fill="#64748B"># Load &amp; Process Relational Insights</tspan>
      </text>
      <!-- Line 4 -->
      <text y="66">
        <tspan fill="#F8FAFC">df</tspan> = <tspan fill="#38BDF8">pd</tspan>.<tspan fill="#60A5FA">read_sql</tspan>(<tspan fill="#A3E635">"SELECT * FROM metrics"</tspan>, <tspan fill="#F8FAFC">db_engine</tspan>)
      </text>
      <!-- Line 5 -->
      <text y="84">
        <tspan fill="#F8FAFC">model</tspan> = <tspan fill="#60A5FA">RandomForestClassifier</tspan>(<tspan fill="#F8FAFC">n_estimators</tspan>=<tspan fill="#F59E0B">100</tspan>)
      </text>
      <!-- Line 6 -->
      <text y="102">
        <tspan fill="#F8FAFC">model</tspan>.<tspan fill="#60A5FA">fit</tspan>(<tspan fill="#F8FAFC">df</tspan>.<tspan fill="#60A5FA">drop</tspan>(<tspan fill="#A3E635">'target'</tspan>, <tspan fill="#F8FAFC">axis</tspan>=<tspan fill="#F59E0B">1</tspan>), <tspan fill="#F8FAFC">df</tspan>[<tspan fill="#A3E635">'target'</tspan>])
      </text>
      <!-- Line 7 -->
      <text y="120">
        <tspan fill="#64748B"># Predictive Accuracy: 96.8%</tspan>
      </text>
      <!-- Line 8 -->
      <text y="138">
        <tspan fill="#38BDF8">print</tspan>(<tspan fill="#A3E635">"⚡ Insights Ready &amp; Deployed!"</tspan>)<tspan fill="#00F0FF" class="cursor">|</tspan>
      </text>
    </g>
  </g>
</svg>
