<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 350" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#7000FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes growBar {
        from { stroke-dashoffset: 350; }
        to { stroke-dashoffset: 0; }
      }
      .progress-line { animation: growBar 2s ease-out forwards; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="950" height="350" rx="16" fill="#090D16"/>
  <rect width="950" height="350" rx="16" fill="url(#bgGlow)"/>
  <rect x="10" y="10" width="930" height="330" rx="14" fill="rgba(15, 23, 42, 0.65)" stroke="url(#glassBorder)" stroke-width="1.5"/>

  <!-- Card Title -->
  <text x="35" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#00F0FF" letter-spacing="1.5">⚡ TECHNICAL SKILL PROGRESSION</text>

  <!-- ==================== COLUMN 1 (Left) ==================== -->
  <g transform="translate(35, 65)">
    <!-- Skill 1: Python -->
    <g transform="translate(0, 0)">
      <text x="0" y="16" font-family="sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Python &amp; Core Data Stack</text>
      <text x="400" y="16" font-family="sans-serif" font-size="12" font-weight="700" fill="#00F0FF" text-anchor="end">85%</text>
      <!-- Track -->
      <rect x="0" y="26" width="400" height="8" rx="4" fill="rgba(30, 41, 59, 0.8)"/>
      <!-- Fill -->
      <rect x="0" y="26" width="340" height="8" rx="4" fill="url(#barGrad1)" filter="url(#neonGlow)"/>
    </g>

    <!-- Skill 2: SQL -->
    <g transform="translate(0, 55)">
      <text x="0" y="16" font-family="sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">SQL &amp; Relational Databases</text>
      <text x="400" y="16" font-family="sans-serif" font-size="12" font-weight="700" fill="#A855F7" text-anchor="end">80%</text>
      <rect x="0" y="26" width="400" height="8" rx="4" fill="rgba(30, 41, 59, 0.8)"/>
      <rect x="0" y="26" width="320" height="8" rx="4" fill="url(#barGrad2)" filter="url(#neonGlow)"/>
    </g>

    <!-- Skill 3: Data Analytics -->
    <g transform="translate(0, 110)">
      <text x="0" y="16" font-family="sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Data Analytics &amp; EDA</text>
      <text x="400" y="16" font-family="sans-serif" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="end">82%</text>
      <rect x="0" y="26" width="400" height="8" rx="4" fill="rgba(30, 41, 59, 0.8)"/>
      <rect x="0" y="26" width="328" height="8" rx="4" fill="url(#barGrad3)" filter="url(#neonGlow)"/>
    </g>

    <!-- Skill 4: Pandas & NumPy -->
    <g transform="translate(0, 165)">
      <text x="0" y="16" font-family="sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Pandas &amp; Data Manipulation</text>
      <text x="400" y="16" font-family="sans-serif" font-size="12" font-weight="700" fill="#00F0FF" text-anchor="end">78%</text>
      <rect x="0" y="26" width="400" height="8" rx="4" fill="rgba(30, 41, 59, 0.8)"/>
      <rect x="0" y="26" width="312" height="8" rx="4" fill="url(#barGrad1)" filter="url(#neonGlow)"/>
    </g>
  </g>

  <!-- ==================== COLUMN 2 (Right) ==================== -->
  <g transform="translate(495, 65)">
    <!-- Skill 5: Power BI -->
    <g transform="translate(0, 0)">
      <text x="0" y="16" font-family="sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Power BI &amp; Business Dashboards</text>
      <text x="400" y="16" font-family="sans-serif" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="end">75%</text>
      <rect x="0" y="26" width="400" height="8" rx="4" fill="rgba(30, 41, 59, 0.8)"/>
      <rect x="0" y="26" width="300" height="8" rx="4" fill="#F59E0B" filter="url(#neonGlow)"/>
    </g>

    <!-- Skill 6: Excel -->
    <g transform="translate(0, 55)">
      <text x="0" y="16" font-family="sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Advanced Excel &amp; Modeling</text>
      <text x="400" y="16" font-family="sans-serif" font-size="12" font-weight="700" fill="#10B981" text-anchor="end">78%</text>
      <rect x="0" y="26" width="400" height="8" rx="4" fill="rgba(30, 41, 59, 0.8)"/>
      <rect x="0" y="26" width="312" height="8" rx="4" fill="#10B981" filter="url(#neonGlow)"/>
    </g>

    <!-- Skill 7: Machine Learning -->
    <g transform="translate(0, 110)">
      <text x="0" y="16" font-family="sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Machine Learning &amp; Scikit-Learn</text>
      <text x="400" y="16" font-family="sans-serif" font-size="12" font-weight="700" fill="#EC4899" text-anchor="end">70%</text>
      <rect x="0" y="26" width="400" height="8" rx="4" fill="rgba(30, 41, 59, 0.8)"/>
      <rect x="0" y="26" width="280" height="8" rx="4" fill="#EC4899" filter="url(#neonGlow)"/>
    </g>

    <!-- Skill 8: Git & GitHub -->
    <g transform="translate(0, 165)">
      <text x="0" y="16" font-family="sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Git, GitHub &amp; Version Control</text>
      <text x="400" y="16" font-family="sans-serif" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="end">78%</text>
      <rect x="0" y="26" width="400" height="8" rx="4" fill="rgba(30, 41, 59, 0.8)"/>
      <rect x="0" y="26" width="312" height="8" rx="4" fill="url(#barGrad3)" filter="url(#neonGlow)"/>
    </g>
  </g>
</svg>
